name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
  REDIS_URL: redis://localhost:6379/1
  SECRET_KEY: ci-secret-key-not-used-in-production
  DEBUG: "False"
  ALLOWED_HOSTS: localhost

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install black isort flake8 pylint pylint-django

      - name: Black
        run: black . --check --line-length=120

      - name: isort
        run: isort . --check --profile=black --line-length=120

      - name: Flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E203,E266,E501,W503 --exclude=migrations,.venv

      - name: Pylint
        run: pylint $(git ls-files '*.py' | grep -v migrations) --rcfile=pyproject.toml

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.local

      - name: Run tests
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --target production -t app:${{ github.sha }} .
