repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        args: ["--line-length=120"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--extend-ignore=E203,E266,E501,W503"]
        exclude: migrations/

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: ["--rcfile=pyproject.toml"]
        exclude: migrations/

      - id: django-check
        name: django check
        entry: python manage.py check
        language: system
        pass_filenames: false
        always_run: true

      - id: migrations-check
        name: check for missing migrations
        entry: python manage.py migrate --check
        language: system
        pass_filenames: false
        always_run: true

      - id: commit-msg-format
        name: validate commit message
        entry: python -c "
import sys, re
msg = open(sys.argv[1]).read().strip()
pattern = r'^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,100}$'
if not re.match(pattern, msg.splitlines()[0]):
    print('Commit message must follow Conventional Commits: <type>(<scope>): <subject>')
    sys.exit(1)
"
        language: system
        stages: [commit-msg]
